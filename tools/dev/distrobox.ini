# Hearth's development box: a clean Fedora 45 container on the lead's machine.
# Create:  distrobox assemble create --file tools/dev/distrobox.ini
# Enter:   distrobox enter hearth-f45
# Remove:  distrobox assemble rm --file tools/dev/distrobox.ini
# How to use it: docs/dev-environment.md

[hearth-f45]
image=registry.fedoraproject.org/fedora:45
pull=true
hostname=hearth-f45
# Its own home, so the box's Firefox profiles and config files stay out of the
# host's home. The host's home is still mounted, so the repo is reachable.
home="${HOME}/.local/share/distrobox-homes/hearth-f45"
init=false
nvidia=false
root=false
replace=false
entry=false
# Podman 4.9 (the host's version) fails to start a box with distrobox's
# default "no process limit": every fork fails. A fixed limit works.
additional_flags="--pids-limit=8192"

# Compositor under test, and Wayland tools to inspect it
additional_packages="labwc wlrctl wlr-randr wayland-utils wtype wev foot"
# Qt 6 for the shell, and the library that turns a Qt window into an overlay
additional_packages="qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtwayland-devel"
additional_packages="qt6-qtsvg-devel qt6-qtshadertools-devel qt6-qttools-devel layer-shell-qt-devel"
# The window-switching protocol (foreign-toplevel) the home screen uses
additional_packages="wlr-protocols-devel"
# Building
additional_packages="cmake ninja-build gcc-c++ pkgconf-pkg-config git-core"
# Checkers: C++ lint and format, secret scanning, shell scripts, Qt-specific C++
additional_packages="clang-tools-extra gitleaks ShellCheck clazy"
# Apps the first spike tests against: web-app engine, a ready-made keyboard
additional_packages="firefox stevia"
# Builds OS images (approved by the lead 2026-11-22), pinned to Fedora 45's build
additional_packages="mkosi-26-8.fc45"
# Product code (approved by the lead 2026-11-24): translations, key names, QR codes, word suggestions
additional_packages="kf6-ki18n-devel libxkbcommon-devel qrencode-devel hunspell-devel hunspell-en-US"
# Faster throwaway builds for break-on-purpose test runs (installed by the lead 2026-11-25)
additional_packages="ccache-4.13.6-3.fc45 mold-2.41.0-3.fc45"
# Milestone 1 tests (asked for 2026-11-25): idle and blur protocol definitions,
# a private message bus for notification tests, GTK4 and SDL3 apps for the keyboard
additional_packages="wayland-protocols-devel dbus-daemon gtk4-devel-tools SDL3-devel"
# Asks the compositor for blur behind the menu and keyboard (installed by the lead 2026-11-26)
additional_packages="kf6-kwindowsystem-devel"
# Hearth's fonts (agreed 2026-11-22)
additional_packages="atkinson-hyperlegible-next-fonts google-noto-sans-vf-fonts"
# Graphics drivers and a base font set (the container image has neither)
additional_packages="mesa-dri-drivers default-fonts-core-sans"
